[package]
name = "awgscale-app"
description = "The awgscale app: the window, and the commands its interface calls"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "awgscale_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# never in a package: the tunnel only pretends, for the pictures of the screens
pretend-tunnel = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
awgscale-client = { path = "../core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
