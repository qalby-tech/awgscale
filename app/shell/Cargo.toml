[package]
name = "awgscale-app"
description = "The awgscale app: the window, and the commands its interface calls"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "awgscale_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# never in a package: the tunnel only pretends, for the pictures of the screens
pretend-tunnel = ["pictures"]
# never in a package: joins the stand-in panel of app/tests/android.sh
test-panel = ["awgscale-client/test-panel"]
# never in a package: the buttons named in AWGSCALE_PRESS are pressed (src/pictures.rs), for pictures
# where no WebDriver drives the window (the iOS simulator)
pictures = ["dep:serde_json"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
awgscale-client = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
tauri = { version = "2", features = [] }

# the phone's tunnel and links (a Tauri plugin with its Kotlin side); never in a desktop build
[target.'cfg(target_os = "android")'.dependencies]
awgscale-android = { path = "../android" }

# the camera reads an invitation's QR code; only on a phone
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# the tunnel on iOS: the Network Extension, driven from the app's Swift side
[target.'cfg(target_os = "ios")'.dependencies]
awgscale-tunnel-ios = { path = "../tunnel-ios" }
