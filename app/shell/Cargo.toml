[package]
name = "awgscale-app"
description = "The awgscale app: the window, and the commands its interface calls"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "awgscale_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# never in a package: the tunnel only pretends, for the pictures of the screens
pretend-tunnel = []
# never in a package: joins the stand-in panel of app/tests/android.sh
test-panel = ["awgscale-client/test-panel"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
awgscale-client = { path = "../core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

# the phone's tunnel and links (a Tauri plugin with its Kotlin side); never in a desktop build
[target.'cfg(target_os = "android")'.dependencies]
awgscale-android = { path = "../android" }
