[package]
name = "awgscale-client"
description = "What every awgscale app shares: the join link, the invitation, the app API, the saved network and the tunnel's shape"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# never in a package: the Android emulator test's build joins a stand-in panel (see invite.rs, test_panel)
test-panel = []

[dependencies]
base64 = "0.22"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"
