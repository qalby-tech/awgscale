# The extension's signing for a build that goes to a phone or TestFlight, included in the app's Xcode
# project (app/ios/project.yml) when AWGSCALE_IOS_SIGNED=YES while XcodeGen runs. The app's own target is
# signed by `tauri ios build` itself (IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD, IOS_MOBILE_PROVISION);
# Tauri knows nothing of the extension, so its profile is named here. XcodeGen fills the variables in
# from the environment (the workflow sets them from its secrets: .github/workflows/app-ios.yml, job
# testflight; app/README.md, «iPhone»). Never tried yet: it needs the owner's Apple developer account.

targets:
  AwgscaleTunnel:
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ${APPLE_DEVELOPMENT_TEAM}
        CODE_SIGN_IDENTITY: Apple Distribution
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: ${AWGSCALE_TUNNEL_PROFILE_UUID}
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": ${AWGSCALE_TUNNEL_PROFILE_UUID}
