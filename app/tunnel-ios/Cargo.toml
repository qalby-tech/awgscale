[package]
name = "awgscale-tunnel-ios"
description = "The tunnel on iOS: the app's Swift side (ios/) that drives the Network Extension, and the core's Tunnel over it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
awgscale-client = { path = "../core" }

# the plugin itself exists only on iOS; elsewhere only refusal.rs is built, for its tests
[target.'cfg(target_os = "ios")'.dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[build-dependencies]
# link_apple_library: builds the Swift package in ios/ with swift-rs and links it (on a Mac, for iOS)
tauri-utils = { version = "2", features = ["build-2"] }
