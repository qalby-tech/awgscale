# The app for Windows: the service (qalby.exe) and the installer, built and
# checked on a Windows runner — the one Windows machine the project has, so the
# tunnel's own checks run here too. The installer is kept as an artifact of the run.
name: app-windows

on:
  push:
    branches: [main, app-client]
    paths: ["app/**", ".github/workflows/app-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Wintun, the adapter driver's library: pinned by version and checksum; its licence goes with it
  WINTUN_VERSION: "0.14.1"
  WINTUN_SHA256: "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"

jobs:
  # the tunnel itself: quick, the first thing to look at
  tunnel:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/qalby/go.mod
          cache-dependency-path: app/qalby/go.sum

      - name: the service
        working-directory: app/qalby
        run: |
          go vet ./...
          go test -count=1 ./...
          CGO_ENABLED=0 go build -trimpath -o ../target/qalby/qalby.exe ./cmd/qalby
          CGO_ENABLED=0 go build -trimpath -o ../target/qalby/testserver.exe ./cmd/testserver

      - name: Wintun
        run: |
          curl -sfL -o wintun.zip "https://www.wintun.net/builds/wintun-$WINTUN_VERSION.zip"
          echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c - || { sha256sum wintun.zip; exit 1; }
          unzip -q wintun.zip
          mkdir -p app/target/wintun
          cp wintun/bin/amd64/wintun.dll wintun/LICENSE.txt app/target/wintun/
          cp wintun/bin/amd64/wintun.dll app/target/qalby/

      - name: the tunnel on Windows
        shell: pwsh
        timeout-minutes: 6
        run: app/tests/tunnel-windows.ps1 -Bin "$env:GITHUB_WORKSPACE\app\target\qalby"

  # the app and its installer, installed and taken away again
  installer:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/qalby/go.mod
          cache-dependency-path: app/qalby/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: the service
        working-directory: app/qalby
        run: |
          go vet ./...
          go test -count=1 ./...
          CGO_ENABLED=0 go build -trimpath -o ../target/qalby/qalby.exe ./cmd/qalby
          CGO_ENABLED=0 go build -trimpath -o ../target/qalby/testserver.exe ./cmd/testserver

      - name: Wintun
        run: |
          curl -sfL -o wintun.zip "https://www.wintun.net/builds/wintun-$WINTUN_VERSION.zip"
          echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c - || { sha256sum wintun.zip; exit 1; }
          unzip -q wintun.zip
          mkdir -p app/target/wintun
          cp wintun/bin/amd64/wintun.dll wintun/LICENSE.txt app/target/wintun/
          cp wintun/bin/amd64/wintun.dll app/target/qalby/

      - name: the core
        working-directory: app
        run: |
          cargo test -q -p awgscale-client
          cargo build -q -p awgscale-client --example status

      - name: the installer
        working-directory: app
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          cd shell && ../ui/node_modules/.bin/tauri build --bundles nsis

      - name: the installer installs (twice, the second over the first), the service runs, the app starts, an ordinary person may ask the service; it uninstalls
        shell: pwsh
        timeout-minutes: 8
        run: |
          $installer = Get-ChildItem app/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList "/S" -Wait
          Start-Process $installer.FullName -ArgumentList "/S" -Wait
          $directory = "$env:ProgramFiles\awgscale"
          Get-ChildItem $directory | Select-Object Name | Out-String
          if (-not (Test-Path "$directory\qalby.exe") -or -not (Test-Path "$directory\wintun.dll")) { throw "the service's files are not installed" }
          if ((Get-Service awgscale).Status -ne "Running") { throw "the service does not run after an install over an install" }
          $writable = (Get-Acl $directory).Access | Where-Object { $_.IdentityReference -match "Users" -and $_.FileSystemRights -match "Write|Modify|FullControl" }
          if ($writable) { throw "ordinary users may write where the service's files are" }
          $status = & "$directory\qalby.exe" status
          if ($status -notmatch '"state":"down"') { throw "the service does not answer: $status" }

          # the app's own client (Rust), as a person with no administrator's rights
          $password = "Aw9-" + [guid]::NewGuid().ToString("N").Substring(0, 16)
          $secret = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name awgperson -Password $secret -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member awgperson
          $credential = New-Object System.Management.Automation.PSCredential ("awgperson", $secret)
          $out = Join-Path $env:PUBLIC "awg-status.txt"
          $example = Resolve-Path app/target/debug/examples/status.exe
          Start-Process $example -Credential $credential -LoadUserProfile -Wait -RedirectStandardOutput $out -WorkingDirectory $env:PUBLIC
          $asked = Get-Content $out -Raw
          "an ordinary person's app client got: $asked"
          if ($asked -notmatch '"state":"down"') { throw "an ordinary person cannot ask the service through the app's client" }

          # the app itself starts and stays
          $app = Get-ChildItem $directory -Filter "awgscale*.exe" | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          $running = Start-Process $app.FullName -PassThru
          Start-Sleep 8
          if ($running.HasExited) { throw "the app stopped at once ($($running.ExitCode))" }
          Stop-Process -Id $running.Id -Force

          Start-Process "$directory\uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep 5
          if (Get-Service awgscale -ErrorAction SilentlyContinue) { throw "the uninstaller left the service" }
          "installer: ok"

      - uses: actions/upload-artifact@v4
        with:
          name: awgscale-windows-installer
          path: app/target/release/bundle/nsis/*.exe
          if-no-files-found: error
