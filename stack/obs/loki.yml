# The change journal (and nothing else: see alloy.alloy). Single process,
# files on a volume, entries older than 400 days are deleted by the compactor.
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
# The journal is a few lines a day: nothing is gained by holding them in memory.
# A stream that is quiet for two minutes goes to disk, and so does everything
# at shutdown (a recreated container once came back without its newest lines).
ingester:
  chunk_idle_period: 2m
  wal:
    flush_on_shutdown: true
    checkpoint_duration: 30s
schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
limits_config:
  retention_period: 9600h          # 400 days
  max_query_length: 9700h          # the journal page asks for all of it
  split_queries_by_interval: 0
  reject_old_samples: true
  reject_old_samples_max_age: 168h
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: false
pattern_ingester:
  enabled: false
analytics:
  reporting_enabled: false
