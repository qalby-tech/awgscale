# Traffic history: per-user byte counters scraped from the panel.
# Retention lives here (the command-line flags are deprecated since 3.x).
global:
  scrape_interval: 30s
  scrape_timeout: 10s
storage:
  tsdb:
    retention:
      time: 400d
      size: 2GB
scrape_configs:
  - job_name: vpn
    static_configs:
      - targets: ["panel:9101"]
