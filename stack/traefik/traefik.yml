# Traefik static configuration
entryPoints:
  # Port 80 is open to the world for Let's Encrypt HTTP-01 only. No router is
  # attached to it, so anything except the ACME challenge gets a 404.
  web:
    address: ":80"
  # Admin panel. Firewalled by UFW to the admin addresses and the VPN tunnel.
  panel:
    address: ":443"
  # The app on the users' own devices, inside the tunnel only: UFW lets just
  # awg0 to it, and the router below allow-lists the tunnel. Plain HTTP: the
  # tunnel itself is the encryption, and an address inside it has no certificate.
  app:
    address: ":8088"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  le:
    acme:
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web

api:
  dashboard: false
ping: false
log:
  level: INFO
