# The settings of a NEW server: the seed (cascade/deploy.sh copies it only where
# there is none). On a running server the settings live in the database and
# /root/awg/cascade/cascade.conf is compiled from it by the agent — change them with
# `docker exec vpn-agent python -m awgscale.agent cascade-set <base64 of the document>`.
CLIENT_IF="awg0"
CLIENT_SUBNET="172.16.17.0/24"
# A single server: the devices connect to this server and their
# internet leaves from it. No exits are named, nothing is routed by country.
# For a cascade (some traffic leaves through exits abroad) add an exit in the panel
# (Servers → Add exit) or with ops/exit.sh add: SINGLE_SERVER goes, the exit gets its line.
SINGLE_SERVER=1
# The rest is what a cascade needs once the first exit is added (a single server
# ignores it). In list mode: also send UDP (except port 443) to non-Russian
# addresses abroad, so that calls work.
UDP_VIA_EXIT=1
# "index:interface:tunnel address of the entry on that exit:display name:weight"
#   "1:awgk1:10.77.1.2:exit1:2"
EXITS=(
)
# This server's own DNS upstreams, resolved through an exit
DNS_VIA_EXIT=(1.1.1.1 1.0.0.1 9.9.9.9)
# Local (Docker) subnets whose outgoing traffic must leave through an exit
VIA_EXIT_SUBNETS=(172.30.99.0/24)
# Health-probe targets, pinged through each exit
PROBE_TARGETS=(1.1.1.1 9.9.9.9)
# Addresses to force through the Russian side despite the list (space separated)
EXTRA_RU_NETS=""
